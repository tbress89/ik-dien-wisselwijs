          }
        }
        players = players.filter((item) => item.id !== id);
        syncCurrentMatchState();
        renderApp();
      };

      window.toggleAttendance = function (id) {
        const p = players.find((pl) => pl.id === id);
        if (!p) return;
        p.present = !p.present;

        if (!p.present) {
          const currentFormat = getCurrentFormat();
          for (let q = 1; q <= currentFormat.quarters; q++) {
            for (let i = 1; i <= currentFormat.segments; i++) {
               p.assignments[q][i] = null;
            }
          }
        }

        syncCurrentMatchState();
        renderApp();
      };


      // --- Quarter Cloning ---
      window.cloneQuarter = function (targetQuarter) {
        const sourceQuarter = targetQuarter - 1;
        if (sourceQuarter < 1) return;

        const currentFormat = getCurrentFormat();
        const periodPrefix = currentFormat.quarters === 2 ? "H" : "Q";

        const hasSourceAssignments = players.some(
          (p) => isPlayerAssignedInQuarter(p, sourceQuarter)
        );

        if (!hasSourceAssignments) {
          alert(`Periode ${periodPrefix}${sourceQuarter} is nog leeg. Wijs eerst spelers toe in ${periodPrefix}${sourceQuarter}.`);
          return;
        }

        players.forEach((p) => {
          if (p.present !== false) {
            p.assignments[targetQuarter][1] = p.assignments[sourceQuarter][1];
            p.assignments[targetQuarter][2] = p.assignments[sourceQuarter][2];
            p.assignments[targetQuarter][3] = p.assignments[sourceQuarter][3];
          } else {
            p.assignments[targetQuarter][1] = null;
            p.assignments[targetQuarter][2] = null;
            p.assignments[targetQuarter][3] = null;
          }
        });

        syncCurrentMatchState();
        renderApp();
        showToast(`Opstelling van ${periodPrefix}${sourceQuarter} gekopieerd naar ${periodPrefix}${targetQuarter}!`);
      };


      // --- Streamlined & Smart Modal System ---
      window.openModal = function (quarter, pos) {
        activePosition = pos;
        activeQuarter = quarter;
        const currentFormat = getCurrentFormat();
        
        const isHalves = currentFormat.quarters === 2;
        const periodPrefix = isHalves ? "H" : "Q";
        const periodName = isHalves ? "de helft" : "het quarter";
        const fullPeriodName = isHalves ? "volledige helft" : "volledig quarter";

        document.getElementById("modalPosName").textContent = pos;
        document.getElementById("modalQuarterName").textContent = periodPrefix + quarter;

        // Dynamic labels for current format
        const subToggleLabel = document.getElementById("modalSubToggleLabel");
        const fullQuarterLabel = document.getElementById("fullQuarterLabel");

        if (subToggleLabel) {
          if(currentFormat.segments === 3) {
             subToggleLabel.textContent = `Wissel inplannen (na 15 of 30 min)`;
          } else {
             subToggleLabel.textContent = `Wissel halverwege ${periodName} (na ${currentFormat.subTimeLabel} min)`;
          }
        }
        if (fullQuarterLabel) {
          fullQuarterLabel.textContent = `Speler (${fullPeriodName}: ${currentFormat.quarterMinutes} min)`;
        }
        
        document.getElementById("part1Label").textContent = `Deel 1 (0:00 - ${currentFormat.segmentMinutes}:00)`;
        document.getElementById("part2Label").textContent = `Deel 2 (${currentFormat.segmentMinutes}:00 - ${currentFormat.segmentMinutes*2}:00)`;
        
        if(currentFormat.segments === 3) {
            part3Group.style.display = "flex";
            document.getElementById("part3Label").textContent = `Deel 3 (${currentFormat.segmentMinutes*2}:00 - ${currentFormat.segmentMinutes*3}:00)`;
        } else {
            part3Group.style.display = "none";
        }

        const p1 = players.find((p) => p.assignments[quarter][1] === pos);
        const p2 = players.find((p) => p.assignments[quarter][2] === pos);
        const p3 = currentFormat.segments === 3 ? players.find((p) => p.assignments[quarter][3] === pos) : null;

        let isSplit = false;
        if (currentFormat.segments === 3) {
            isSplit = (p1 && p2 && p1.id !== p2.id) || (p1 && p3 && p1.id !== p3.id) || (p2 && p3 && p2.id !== p3.id);
        } else {
            isSplit = p1 && p2 && p1.id !== p2.id;
        }

        modalSubToggle.checked = isSplit;
        
        // This will sync display block/none
        toggleSubMode();
        populateSmartOptions(quarter, pos, p1 ? p1.id : null, p2 ? p2.id : null, p3 ? p3.id : null);

        assignModal.classList.add("active");
      };

      window.toggleSubMode = function () {
        const isSplit = modalSubToggle.checked;
        const currentFormat = getCurrentFormat();
        
        if (isSplit) {
          fullQuarterGroup.style.display = "none";
          splitQuarterGroup.style.display = "block";
          if (fullQuarterSelect.value) {
            part1Select.value = fullQuarterSelect.value;
            part2Select.value = fullQuarterSelect.value;
            if(currentFormat.segments === 3) part3Select.value = fullQuarterSelect.value;
          }
        } else {
          fullQuarterGroup.style.display = "block";
          splitQuarterGroup.style.display = "none";
          if (part1Select.value) {
            fullQuarterSelect.value = part1Select.value;
          }
        }
      }

      function populateSmartOptions(quarter, currentPos, currentH1Id, currentH2Id, currentP3Id) {
        const selects = [fullQuarterSelect, part1Select, part2Select, part3Select];
        const currentFormat = getCurrentFormat();

        selects.forEach((sel) => (sel.innerHTML = '<option value="">-- Leeg (Wissel) --</option>'));

        const presentPlayers = players.filter((p) => p.present !== false);

        const sorted = [...presentPlayers].sort((a, b) => {
          const aAssigned = isPlayerAssignedInQuarter(a, quarter, currentPos);
          const bAssigned = isPlayerAssignedInQuarter(b, quarter, currentPos);
          if (aAssigned !== bAssigned) return aAssigned ? 1 : -1;
          return getPlayedMinutes(a) - getPlayedMinutes(b) || a.name.localeCompare(b.name);
        });

        sorted.forEach((p) => {
          const mins = getPlayedMinutes(p);
          const assignedOtherPos = getPlayerOtherAssignmentInQuarter(p, quarter, currentPos);

          let label = "";
          if (assignedOtherPos) {
            label = `⚠️ ${p.name} (Al in opstelling als ${assignedOtherPos})`;
          } else {
            label = `🟢 ${p.name} (Vrij)`;
          }

          selects.forEach((sel) => {
            const opt = document.createElement("option");
            opt.value = p.id;
            opt.textContent = label;
            sel.appendChild(opt);
          });
        });

        if (currentH1Id) part1Select.value = currentH1Id;
        if (currentH2Id) part2Select.value = currentH2Id;
        if (currentP3Id) part3Select.value = currentP3Id;

        if (currentFormat.segments === 3) {
             if (currentH1Id && currentH2Id && currentP3Id && currentH1Id === currentH2Id && currentH2Id === currentP3Id) {
                  fullQuarterSelect.value = currentH1Id;
             } else if (currentH1Id) fullQuarterSelect.value = currentH1Id;
               else if (currentH2Id) fullQuarterSelect.value = currentH2Id;
               else if (currentP3Id) fullQuarterSelect.value = currentP3Id;
        } else {
             if (currentH1Id && currentH2Id && currentH1Id === currentH2Id) {
                  fullQuarterSelect.value = currentH1Id;
             } else if (currentH1Id) fullQuarterSelect.value = currentH1Id;
               else if (currentH2Id) fullQuarterSelect.value = currentH2Id;
        }
      }

      function isPlayerAssignedInQuarter(player, quarter, ignorePos) {
        const fmt = getCurrentFormat();
        for(let i=1; i<=fmt.segments; i++) {
           const pos = player.assignments[quarter][i];
           if (pos && pos !== ignorePos) return true;
        }
        return false;
      }

      function getPlayerOtherAssignmentInQuarter(player, quarter, ignorePos) {
        const fmt = getCurrentFormat();
        for(let i=1; i<=fmt.segments; i++) {
           const pos = player.assignments[quarter][i];
           if (pos && pos !== ignorePos) return pos;
        }
        return null;
      }

      window.closeModal = function () {
        assignModal.classList.remove("active");
      };

      assignModal.addEventListener("click", function (e) {
        if (e.target === assignModal) closeModal();
      });

      window.clearActivePosition = function () {
        players.forEach((p) => {
          if (p.assignments[activeQuarter][1] === activePosition) p.assignments[activeQuarter][1] = null;
          if (p.assignments[activeQuarter][2] === activePosition) p.assignments[activeQuarter][2] = null;
          if (p.assignments[activeQuarter][3] === activePosition) p.assignments[activeQuarter][3] = null;
        });
        closeModal();
        syncCurrentMatchState();
        renderApp();
      };

      window.saveAssignments = function () {
        const currentFormat = getCurrentFormat();
        let s1 = null, s2 = null, s3 = null;

        if (modalSubToggle.checked) {
          s1 = Number(part1Select.value) || null;
          s2 = Number(part2Select.value) || null;
          if (currentFormat.segments === 3) s3 = Number(part3Select.value) || null;
        } else {
          const singleId = Number(fullQuarterSelect.value) || null;
          s1 = singleId;
          s2 = singleId;
          if (currentFormat.segments === 3) s3 = singleId;
        }

        players.forEach((p) => {
          if (p.assignments[activeQuarter][1] === activePosition) p.assignments[activeQuarter][1] = null;
          if (p.assignments[activeQuarter][2] === activePosition) p.assignments[activeQuarter][2] = null;
          if (p.assignments[activeQuarter][3] === activePosition) p.assignments[activeQuarter][3] = null;
        });

        if (s1) {
          const p = players.find((pl) => pl.id === s1);
          if (p) p.assignments[activeQuarter][1] = activePosition;
        }
        if (s2) {
          const p = players.find((pl) => pl.id === s2);
          if (p) p.assignments[activeQuarter][2] = activePosition;
        }
        if (s3 && currentFormat.segments === 3) {
          const p = players.find((pl) => pl.id === s3);
          if (p) p.assignments[activeQuarter][3] = activePosition;
        }

        closeModal();
        syncCurrentMatchState();
        renderApp();
      };

      window.unassignPosition = function (quarter, pos, event) {
        event.stopPropagation();
        players.forEach((p) => {
          if (p.assignments[quarter][1] === pos) p.assignments[quarter][1] = null;
          if (p.assignments[quarter][2] === pos) p.assignments[quarter][2] = null;
          if (p.assignments[quarter][3] === pos) p.assignments[quarter][3] = null;
        });
        syncCurrentMatchState();
        renderApp();
      };

      function getPlayedMinutes(player) {
        const fmt = getCurrentFormat();
        let segmentsPlayed = 0;
        // Only loop through valid periods and segments for the current format
        for (let q = 1; q <= fmt.quarters; q++) {
          if (player.assignments[q][1]) segmentsPlayed++;
          if (player.assignments[q][2]) segmentsPlayed++;
          if (fmt.segments === 3 && player.assignments[q][3]) segmentsPlayed++;
        }
        return segmentsPlayed * fmt.segmentMinutes;
      }

      // --- Render System ---
      function renderApp() {
        renderTabs();
        renderSquadList();
        renderPitches();
      }

      function renderTabs() {
        const currentFormat = getCurrentFormat();
        const numPeriods = currentFormat.quarters;
        const prefix = numPeriods === 2 ? "H" : "Q";

        // Reset tab to "all" if user changes format to fewer quarters while on a now hidden tab
        if (activeMobileTab !== "all" && parseInt(activeMobileTab) > numPeriods) {
          activeMobileTab = "all";
        }

        let tabsHtml = `<button type="button" class="quarter-tab-btn ${activeMobileTab === 'all' ? 'active' : ''}" data-tab="all">Alles</button>`;
        for (let i = 1; i <= numPeriods; i++) {
          tabsHtml += `<button type="button" class="quarter-tab-btn ${activeMobileTab === String(i) ? 'active' : ''}" data-tab="${i}">${prefix}${i}</button>`;
        }
        quarterTabsEl.innerHTML = tabsHtml;
      }

      function renderSquadList() {
        squadListEl.innerHTML = "";
        squadCountEl.textContent = players.length;

        const currentFormat = getCurrentFormat();
        const targetMin = currentFormat.targetMin;
        const targetMax = currentFormat.targetMax;
        const totalMatchMinutes = currentFormat.totalMinutes;

        const presentCount = players.filter((p) => p.present !== false).length;
        attendanceSummaryEl.textContent = `${presentCount} van ${players.length} aanwezig`;

        if (players.length === 0) {
          squadListEl.innerHTML =
            '<div style="text-align:center; color:var(--text-muted); padding:2rem 1rem; font-style:italic;">Geen spelers in de selectie. Voeg een speler toe.</div>';
          return;
        }

        const sortedPlayers = [...players].sort((playerA, playerB) => {
          if (squadSort.value === "minutes") {
            return (
              getPlayedMinutes(playerB) - getPlayedMinutes(playerA) ||
              playerA.name.localeCompare(playerB.name)
            );
          }
          if (squadSort.value === "attendance") {
            const aPres = playerA.present !== false ? 1 : 0;
            const bPres = playerB.present !== false ? 1 : 0;
            if (aPres !== bPres) return bPres - aPres;
            return playerA.name.localeCompare(playerB.name);
          }
          return playerA.name.localeCompare(playerB.name);
        });

        // Target zone CSS position for the track
        const zoneLeft = ((targetMin / totalMatchMinutes) * 100).toFixed(1);
        const zoneWidth = (((targetMax - targetMin) / totalMatchMinutes) * 100).toFixed(1);

        sortedPlayers.forEach((p) => {
          const item = document.createElement("div");
          const isPresent = p.present !== false;
          item.className = `squad-item${isPresent ? "" : " absent"}`;

          const totalMinutes = getPlayedMinutes(p);

          let timeBadgeClass = "time-badge";
          let statusClass = "balanced";
          let targetTooltip = "";

          if (!isPresent) {
            timeBadgeClass += " absent";
            statusClass = "absent";
            targetTooltip = "Afwezig";
          } else if (totalMinutes === 0) {
            timeBadgeClass += " danger";
            statusClass = "danger";
            targetTooltip = `0 min - Onder doel (doel: ${targetMin}–${targetMax} min)`;
          } else if (totalMinutes < targetMin) {
            timeBadgeClass += " warning";
            statusClass = "warning";
            targetTooltip = `${totalMinutes} min - Onder doel (doel: ${targetMin}–${targetMax} min)`;
          } else if (totalMinutes <= targetMax) {
            timeBadgeClass += " balanced";
            statusClass = "balanced";
            targetTooltip = `${totalMinutes} min - In balans (doel: ${targetMin}–${targetMax} min)`;
          } else {
            timeBadgeClass += " high";
            statusClass = "high";
            targetTooltip = `${totalMinutes} min - Boven doel (doel: ${targetMin}–${targetMax} min)`;
          }

          const fillPercent = isPresent ? Math.min(100, Math.round((totalMinutes / totalMatchMinutes) * 100)) : 0;

          item.innerHTML = `
            <div class="squad-item-info">
              <div class="squad-header">
                <div class="squad-name-row">
                  <button 
                    type="button" 
                    class="attendance-btn ${isPresent ? "present" : "absent"}"
                    onclick="toggleAttendance(${p.id})"
                    title="Klik om aanwezigheid te wisselen"
                  >
                    ${isPresent ? "✓ Aanwezig" : "✗ Afwezig"}
                  </button>
                  <span class="squad-name">${p.name}</span>
                </div>
                <span class="${timeBadgeClass}" title="${targetTooltip}">⏱ ${totalMinutes} min</span>
              </div>
              ${isPresent ? `
              <div class="target-bar-container" title="${targetTooltip}">
                <div class="target-bar-track">
                  <div class="target-bar-zone" style="left:${zoneLeft}\%; width:${zoneWidth}%;" title="Doelzone: ${targetMin}–${targetMax} min"></div>
                  <div class="target-bar-fill ${statusClass}" style="width: ${fillPercent}%;"></div>
                </div>
              </div>` : ""}
            </div>
            <button class="remove-btn" title="Speler definitief verwijderen" onclick="deletePlayer(${p.id})">×</button>
          `;
          squadListEl.appendChild(item);
        });
      }

      function renderPitches() {
        pitchesGridEl.innerHTML = "";
        const presentPlayers = players.filter((p) => p.present !== false);
        const currentFormat = getCurrentFormat();
        const numPeriods = currentFormat.quarters;
        const prefix = numPeriods === 2 ? "H" : "Q";

        for (let q = 1; q <= numPeriods; q++) {
          const pitchContainer = document.createElement("div");
          pitchContainer.className = "pitch-container";
          pitchContainer.dataset.quarter = q;

          // Copy button for periods > 1
          let copyBtnHtml = "";
          if (q > 1) {
            copyBtnHtml = `
              <button 
                type="button" 
                class="btn-copy-quarter" 
                onclick="cloneQuarter(${q})"
                title="Kopieer alle posities van ${prefix}${q - 1} naar ${prefix}${q}"
              >
                📋 Kopieer ${prefix}${q - 1}
              </button>
            `;
          }

          pitchContainer.innerHTML = `
            <div class="pitch-header">
              <div class="pitch-title">${prefix}${q}</div>
              ${copyBtnHtml}
            </div>
          `;

          const pitch = document.createElement("div");
          pitch.className = "pitch";
          pitch.innerHTML = `
            <div class="halfway-line pitch-line"></div>
            <div class="center-circle"></div>
            <div class="center-spot"></div>
            <div class="penalty-box-top"></div>
            <div class="penalty-box-bottom"></div>
          `;

          Object.keys(currentFormat.formation).forEach((pos) => {
            const p1 = players.find((p) => p.assignments[q][1] === pos);
            const p2 = players.find((p) => p.assignments[q][2] === pos);
            const p3 = currentFormat.segments === 3 ? players.find((p) => p.assignments[q][3] === pos) : null;
            const coords = currentFormat.formation[pos];

            let assignments = [p1, p2];
            if (currentFormat.segments === 3) assignments.push(p3);

            const node = document.createElement("div");
            node.className = "player-node";
            node.style.top = coords.top;
            node.style.left = coords.left;

            const hasAny = assignments.some(p => p !== null && p !== undefined);

            if (!hasAny) {
              node.classList.add("empty");
              node.innerHTML = `<div class="jersey ghost">${pos}</div>`;
              node.onclick = () => openModal(q, pos);
            } else {
              let blocks = [];
              // Cluster consecutive segments into visual blocks
              assignments.forEach((p, index) => {
                  let playerObj = p ? p : {id: null, name: '-'};
                  if (blocks.length > 0 && blocks[blocks.length - 1].id === playerObj.id) {
                      blocks[blocks.length - 1].end = (index + 1) * currentFormat.segmentMinutes;
                  } else {
                      blocks.push({
                          id: playerObj.id,
                          name: playerObj.name,
                          start: index * currentFormat.segmentMinutes,
                          end: (index + 1) * currentFormat.segmentMinutes
                      });
                  }
              });

              let jerseyClass = blocks.length === 1 ? "jersey full" : "jersey split";
              let nameHtml = "";

              if (blocks.length === 1) {
                nameHtml = `<div class="player-name" title="${blocks[0].name}">${blocks[0].name}</div>`;
              } else {
                let fullTitle = blocks.map(b => `${b.name} (${b.start}'-${b.end}')`).join(' 🔄 ');
                nameHtml = `<div class="player-name split" title="${fullTitle}">`;
                blocks.forEach((b, i) => {
                    let arrow = i === 0 ? '' : '<span class="sub-arrow">🔄</span>';
                    nameHtml += `<div class="sub-name">${arrow}${b.name}</div>`;
                });
                nameHtml += `</div>`;
              }

              node.innerHTML = `
                <div class="${jerseyClass}">
                  ${pos}
                  <button class="unassign-btn" title="Positie vrijmaken" onclick="unassignPosition(${q}, '${pos}', event)">×</button>
                </div>
                ${nameHtml}
              `;
              node.onclick = () => openModal(q, pos);
            }
            pitch.appendChild(node);
          });

          pitchContainer.appendChild(pitch);

          // --- Wisselbank (Bench) per Quarter ---
          const benchContainer = document.createElement("div");
          benchContainer.className = "bench-container";

          const benchList = document.createElement("div");
          benchList.className = "bench-list";

          let benchCount = 0;
          presentPlayers.forEach((p) => {
            const a = p.assignments[q];
            
            // Player is on bench if they don't start the period in segment 1
            if (!a[1]) {
              let playsLater = false;
              let firstSegmentIn = null;
              
              if (a[2]) { 
                playsLater = true; 
                firstSegmentIn = 2; 
              } else if (currentFormat.segments === 3 && a[3]) { 
                playsLater = true; 
                firstSegmentIn = 3; 
              }
              
              benchCount++;
              const chip = document.createElement("span");
              if (!playsLater) {
                 chip.className = "bench-chip full-bench";
                 chip.textContent = p.name;
              } else {
                 const timeIn = (firstSegmentIn - 1) * currentFormat.segmentMinutes;
                 chip.className = "bench-chip partial-bench";
                 chip.innerHTML = `${p.name} <span class="bench-sub-note">(valt in na ${timeIn}')</span>`;
              }
              benchList.appendChild(chip);
            }
          });

          benchContainer.innerHTML = `
            <div class="bench-title">
              <span>Wisselbank (${benchCount})</span>
            </div>
          `;

          if (benchCount === 0) {
            benchList.innerHTML = '<span class="bench-empty">Geen wissels bij start.</span>';
          }
          benchContainer.appendChild(benchList);
          pitchContainer.appendChild(benchContainer);

          pitchesGridEl.appendChild(pitchContainer);
        }

        updateMobileTabVisibility();
      }

      // --- Initialization ---
      renderMatchSelect();
      switchView("landing");
    </script>
  </body>
</html>
